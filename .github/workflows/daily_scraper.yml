name: Manual Scraper Trigger

on:
  workflow_dispatch: # Permette l'avvio solo manuale se richiesto

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html target_lists.json
          git diff --staged --quiet || git commit -m "Auto-update RateYourMusic releases [skip ci]"
          git push
