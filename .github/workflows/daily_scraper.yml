name: Daily RateYourMusic Scraper

on:
  schedule:
    # Runs every day at 03:00 UTC (05:00 Rome CEST / 04:00 Rome CET)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub website

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html target_lists.json
          git diff --staged --quiet || git commit -m "Auto-update RateYourMusic releases [skip ci]"
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
